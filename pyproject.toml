[project]
name = "mail-manage"
version = "0.1.0"
description = "mail_list_management"
authors = [
    { name = "Yurii", email = "yurii.1986.e@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "django (>=5.2.3,<6.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "ipython (>=9.3.0,<10.0.0)",
    "redis (>=6.2.0,<7.0.0)",
    "django-debug-toolbar (>=6.0.0,<7.0.0)",
    "environs (>=15.0.1,<16.0.0)",
    "ruff (>=0.15.18,<0.16.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



[tool.ruff]
target-version = "py313"

line-length = 119

indent-width = 4

src = ["."]

exclude = [
    "**/migrations/**",
    "**/tests.py",
    "**/tests/**",
    "**/fixtures/**",
    "**/__pycache__/**",
    ".venv",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C",
    "S",
    "D",
    "UP",
]

ignore = [
    "E501",
    "S101",
]

fixable = ["ALL"]

