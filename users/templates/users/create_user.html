{% extends 'home.html'%}
{% block title%}Регистрация{% endblock %}
{% load static %}
{% block content %}
<div class="container col-8">
    <div class="card-body " style="background-color: #d4d4d4; border-radius: 5px">
        <div class="card-header">
            <h2 class="my-0 font-weight-normal">Регистрация</h2>
        </div>
        <div class="container  text-center mb-3 py-3">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="p-2 btn btn-outline-dark fixed-size-btn"> Регистрация</button>
                <a href="{% url 'mailing:statistic' %}" class="p-2 btn btn-outline-dark fixed-size-btn">Отмена</a>
            </form>

        </div>
    </div>
</div>
{% endblock %}
