{% extends 'home.html'%}
{% block title%}Изменение статуса пользователя{% endblock %}
{% block content %}


<div class="container text-center mb-3 py-3">
    <h3>Изменение статуса пользователя "{{ user.email }}"</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="p-2 btn btn-outline-dark fixed-size-btn">Сохранить </button>
    </form>
</div>
{% endblock %}
